<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Deutsch Trainer</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f6f4f" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Deutsch" />
</head>
<body>
  <header class="app-header">
    <h1>Deutsch Trainer</h1>
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Меню" aria-expanded="false" hidden>☰</button>
  </header>

  <nav id="menuPanel" class="menu-panel" hidden>
    <div id="menuUser" class="menu-user"></div>
    <button id="historyBtn" class="menu-item" type="button">Історія</button>
    <button id="resetBtn" class="menu-item" type="button">Скинути прогрес</button>
    <button id="switchUserBtn" class="menu-item" type="button">Змінити користувача</button>
  </nav>

  <main class="app-main">

    <section id="screen-login" class="screen">
      <div class="panel login-panel">
        <p class="muted">Увійди, щоб прогрес зберігався за тобою, а не за пристроєм.</p>
        <div id="googleSignInBtn"></div>
        <div class="divider"><span id="orText">або</span></div>
        <form id="emailForm" class="email-form">
          <input id="emailInput" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
          <button id="sendCodeBtn" type="submit" class="btn primary">Надіслати код</button>
        </form>
        <p id="loginError" class="muted login-error" hidden></p>
      </div>
    </section>

    <section id="screen-code" class="screen" hidden>
      <div class="panel login-panel">
        <p id="codeHint" class="muted"></p>
        <form id="codeForm" class="email-form">
          <input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 цифр" required />
          <button id="verifyCodeBtn" type="submit" class="btn primary">Увійти</button>
        </form>
        <p id="codeError" class="muted login-error" hidden></p>
        <button id="changeEmailBtn" type="button" class="btn ghost small">Змінити пошту</button>
      </div>
    </section>

    <section id="screen-select" class="screen" hidden>
      <p id="learnedLine" class="learned-line"></p>
      <button id="startBtn" class="btn primary big" type="button">Почати</button>
      <button id="topicsBtn" class="btn ghost" type="button">Теми та рівень: <span id="topicSummary"></span></button>
    </section>

    <section id="screen-topics" class="screen" hidden>
      <h2>Теми та рівень</h2>
      <div id="catChecks" class="list"></div>
      <div id="levelSeg" class="segmented" role="group" aria-label="Рівень">
        <button type="button" data-level="all">Усі</button>
        <button type="button" data-level="A2">A2</button>
        <button type="button" data-level="B1">B1</button>
        <button type="button" data-level="B2">B2</button>
        <button type="button" data-level="C1">C1</button>
      </div>
      <button id="topicsBack" class="btn primary big" type="button">Готово</button>
    </section>

    <section id="screen-quiz" class="screen" hidden>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

      <div class="card">
        <div class="topic-label" id="topicLabel"></div>
        <div class="sentence">
          <span id="sentenceBefore"></span>
          <input id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <span id="sentenceAfter"></span>
        </div>

        <button id="translationToggle" class="btn ghost small" type="button">Переклад</button>
        <div id="translationText" class="translation" hidden></div>

        <div id="feedback" class="feedback" hidden></div>
        <div id="feedbackNote" class="feedback-note"></div>

        <button id="checkBtn" class="btn primary big" type="button">Перевірити</button>
      </div>

      <button id="quitBtn" class="btn ghost small" type="button">Завершити</button>
    </section>

    <section id="screen-summary" class="screen" hidden>
      <h2>Сесію завершено</h2>
      <div id="summaryStats" class="summary-stats"></div>
      <button id="backToStart" class="btn primary big" type="button">До початку</button>
    </section>

    <section id="screen-history" class="screen" hidden>
      <h2>Історія</h2>
      <p id="historySummary" class="muted"></p>

      <div class="panel">
        <span class="field-label">Проблемні теми</span>
        <div id="historyProblems"></div>
      </div>

      <div class="panel">
        <span class="field-label">Останні сесії</span>
        <div id="historySessions"></div>
      </div>

      <button id="historyBack" class="btn primary big" type="button">До початку</button>
    </section>

  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
